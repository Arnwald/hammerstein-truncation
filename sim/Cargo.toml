[package]
name = "hammerstein-truncation"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Truncation error of single-level Hammerstein identification from exponential swept sines: exact closed forms and a simulated measurement chain"

[lib]
name = "hammerstein_truncation"
path = "src/lib.rs"

[[bin]]
name = "hsim"
path = "src/main.rs"

[dependencies]
num-complex = "0.4"
rayon = "1.12"
realfft = "3.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.7"

[profile.release]
opt-level = 3
